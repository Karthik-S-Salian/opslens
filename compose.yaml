name: opslens

x-api-env: &api-env
  DATABASE_URL: postgresql+asyncpg://opslens:opslens@postgres:5432/opslens
  REDIS_URL: redis://redis:6379/0
  VICTORIALOGS_URL: http://victorialogs:9428
  S3_ENDPOINT_URL: http://s3:8333
  S3_PUBLIC_ENDPOINT_URL: http://localhost:8333
  API_TOKEN: dev-token
  OLLAMA_URL: http://host.docker.internal:11434
  CHAT_MODEL: qwen3:8b
  EMBED_MODEL: bge-m3
  S3_ACCESS_KEY: opslens
  S3_SECRET_KEY: opslens123
  S3_BUCKET: opslens

services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: opslens
      POSTGRES_PASSWORD: opslens
      POSTGRES_DB: opslens
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opslens -d opslens"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Retention is global (30d), not per-field. Pin the tag once you pick a release.
  victorialogs:
    image: victoriametrics/victoria-logs:latest
    command: ["-storageDataPath=/vlogs", "-retentionPeriod=30d"]
    ports:
      - "9428:9428"
    volumes:
      - vldata:/vlogs

  # SeaweedFS: real S3-compatible storage, 280MB, actively released, survives restarts.
  # LocalStack 4.14.0 also passes the ingest flow (see README) but is 1.65GB, its newer
  # images require a license token, and community S3 state did not survive a restart.
  s3:
    image: chrislusf/seaweedfs:latest
    command: ["server", "-s3", "-s3.port=8333", "-ip.bind=0.0.0.0", "-dir=/data"]
    ports:
      - "8333:8333"
    volumes:
      - s3data:/data

  api:
    build: .
    environment: *api-env
    restart: unless-stopped
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      victorialogs:
        condition: service_started
      s3:
        condition: service_started
    # Single-instance dev only: migrations run inline. Move to a one-shot job before scaling.
    command:
      - sh
      - -c
      - alembic upgrade head && uvicorn opslens.api.main:app --host 0.0.0.0 --port 8000

  worker:
    build: .
    environment: *api-env
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      victorialogs:
        condition: service_started
      s3:
        condition: service_started
    command: ["python", "-m", "opslens.ingest.worker"]

volumes:
  pgdata:
  redisdata:
  vldata:
  s3data:
